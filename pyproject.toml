[project]
name = "pairs-trading"
version = "0.1.0"
description = "Pairs trading research sandbox (clustering, discovery, backtest)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "yfinance>=0.2.40",
  "pandas-datareader>=0.10",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.20",
  "pyarrow>=14.0",
  "lxml>=5.0",
  "requests>=2.31",
  "wrds>=3.1.6",
]

[tool.uv]
# Enables `uv sync` to install deps from pyproject.
